<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leetify</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <h1>Leetify</h1>
        <p class="subtitle">LeetCode → GitHub</p>

        <div class="form-group">
            <label for="owner">GitHub Username / Owner</label>
            <input
                type="text"
                id="owner"
                placeholder="your-username"
            >
        </div>

        <div class="form-group">
            <label for="repo">Repository</label>
            <input
                type="text"
                id="repo"
                placeholder="leetcode-solutions"
            >
        </div>

        <div class="form-group">
            <label for="token">GitHub Token</label>
            <input
                type="password"
                id="token"
                placeholder="github_pat_..."
            >
        </div>

        <button id="saveBtn">
            Save & Test
        </button>

        <div id="status"></div>

    </div>

    <script src="popup.js"></script>

</body>
</html>
